<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050506">
<title>PDF Portfolio | IMRUZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer-body">
<header class="viewer-header"><div class="viewer-header-inner">
  <a class="brand" href="index.html" aria-label="IMRUZZ home">IMRUZZ<span class="brand-dot">.</span></a>
  <nav class="viewer-actions" aria-label="Portfolio navigation">
    <a class="button button-outline" id="back-link" href="index.html#pdf-portfolios">← Back to Portfolio</a>
    <a class="button button-primary" id="download-link" href="#" download hidden>Download PDF ↧</a>
  </nav>
</div></header>
<main class="viewer-content">
  <div class="viewer-heading">
    <p class="eyebrow">IMRUZZ / PDF PORTFOLIO</p>
    <h1 id="pdf-title">PDF <span class="accent">PORTFOLIO.</span></h1>
    <p id="viewer-status" class="viewer-status" role="status">Loading portfolio…</p>
  </div>
  <div class="viewer-pages" id="pages" aria-label="Portfolio pages"></div>
</main>
<footer class="viewer-footer"><a class="text-link" id="footer-back" href="index.html#pdf-portfolios">← Explore More Work</a></footer>
<script type="module">
const $ = id => document.getElementById(id);
const title = $('pdf-title'), status = $('viewer-status'), pages = $('pages'), download = $('download-link');

/* Accepts ?file=name.pdf or ?file=pdfs/name.pdf — local PDFs in the pdfs/ folder only */
let file = new URLSearchParams(location.search).get('file') || '';
if (file && !file.startsWith('pdfs/')) file = 'pdfs/' + file;
const valid = /^pdfs\/[a-z0-9_(). \-]+\.pdf$/i.test(file) && !file.includes('..');

['back-link', 'footer-back'].forEach(id => {
  $(id).addEventListener('click', e => {
    if (document.referrer && history.length > 1 && /index\.html|\/$/.test(document.referrer.split('#')[0].split('?')[0])) { e.preventDefault(); history.back(); }
  });
});

function showError(message) {
  status.textContent = message;
  const box = document.createElement('div');
  box.className = 'viewer-error';
  box.textContent = 'Please check the PDF filename in the pdfs/ folder and in your index.html.';
  pages.replaceChildren(box);
}

function fallback(reason) {
  /* pdf.js could not run (offline, or the page is opened straight from a folder): use the browser's own viewer */
  status.textContent = reason || 'Showing the browser PDF viewer.';
  const iframe = document.createElement('iframe');
  iframe.className = 'viewer-fallback';
  iframe.title = title.textContent;
  iframe.src = file + '#view=FitH';
  pages.replaceChildren(iframe);
}

if (!valid) {
  showError('No valid PDF selected.');
} else {
  const readable = file.split('/').pop().replace(/\.pdf$/i, '').replace(/[-_]/g, ' ');
  title.textContent = readable;
  document.title = readable + ' | IMRUZZ';
  download.href = file; download.hidden = false;

  try {
    const lib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
    lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    const pdf = await lib.getDocument({ url: file }).promise;
    const total = pdf.numPages;
    status.textContent = total + (total === 1 ? ' page' : ' pages') + ' • Scroll to view every page';

    /* page 1 sets the placeholder size so the page does not jump while pages load */
    const first = await pdf.getPage(1);
    const v1 = first.getViewport({ scale: 1 });
    const ratio = v1.width + ' / ' + v1.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    /* render one page at a time so scrolling stays smooth */
    let chain = Promise.resolve();
    const render = (n, box) => chain = chain.then(async () => {
      try {
        const page = n === 1 ? first : await pdf.getPage(n);
        const nat = page.getViewport({ scale: 1 });
        const width = Math.min(960, box.clientWidth || 960);
        const view = page.getViewport({ scale: (width / nat.width) * dpr });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(view.width);
        canvas.height = Math.ceil(view.height);
        await page.render({ canvasContext: canvas.getContext('2d', { alpha: false }), viewport: view }).promise;
        box.style.aspectRatio = '';
        box.replaceChildren(canvas);
        page.cleanup();
      } catch (e) { console.warn('Page', n, e); }
    });

    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        io.unobserve(en.target);
        render(Number(en.target.dataset.page), en.target);
      });
    }, { rootMargin: '900px 0px' });

    const frag = document.createDocumentFragment();
    for (let n = 1; n <= total; n++) {
      const fig = document.createElement('figure');
      fig.className = 'viewer-page';
      const box = document.createElement('div');
      box.className = 'page-box';
      box.style.aspectRatio = ratio;
      box.dataset.page = n;
      const cap = document.createElement('figcaption');
      cap.textContent = 'PAGE ' + n + ' / ' + total;
      fig.append(box, cap);
      frag.append(fig);
      io.observe(box);
    }
    pages.replaceChildren(frag);
  } catch (error) {
    console.error(error);
    fallback('PDF preview unavailable here, showing the browser PDF viewer instead.');
  }
}
</script>
</body>
</html>
